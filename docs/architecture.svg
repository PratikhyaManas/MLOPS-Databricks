<svg width="1450" height="780" viewBox="0 0 1450 780" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">MLOPS Databricks Azure-Style Architecture</title>
  <desc id="desc">A premium Azure-inspired MLOps architecture diagram showing ingestion, feature engineering, training, validation, registration, and batch inference using Databricks and MLflow.</desc>

  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0%" stop-color="#f4f9ff"/>
      <stop offset="100%" stop-color="#eef6ff"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f6faff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="green" x1="0" x2="1">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" x2="1">
      <stop offset="0%" stop-color="#f3e8ff"/>
      <stop offset="100%" stop-color="#ddd6fe"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" x2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="slate" x1="0" x2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M 22 0 L 0 0 0 22" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 600 16px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .section { font: 700 12px 'Segoe UI', Arial, sans-serif; fill: #1e293b; letter-spacing: 0.14em; }
      .cardTitle { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .cardText { font: 600 13px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .tiny { font: 700 11px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .badge { font: 700 11px 'Segoe UI', Arial, sans-serif; fill: #1e293b; }
      .pipe { stroke: #64748b; stroke-width: 2.8; fill: none; marker-end: url(#arrow); }
      .line { stroke: #94a3b8; stroke-width: 2.2; fill: none; }
      .chip { fill: #ffffff; stroke: #dbe7f6; stroke-width: 1.5; }
      .card { filter: url(#shadow); }
    </style>
  </defs>

  <rect width="1450" height="780" fill="url(#bg)"/>
  <rect x="28" y="30" width="1394" height="720" rx="26" fill="url(#panel)" stroke="#dfeaf8" stroke-width="2"/>
  <rect x="28" y="30" width="1394" height="720" rx="26" fill="url(#grid)" opacity="0.65"/>

  <g>
    <rect x="120" y="52" width="130" height="28" rx="14" fill="#e0f2fe" stroke="#7dd3fc"/>
    <text x="185" y="71" text-anchor="middle" class="badge">Azure AI</text>
  </g>

  <text x="725" y="81" text-anchor="middle" class="title">MLOPS Databricks Architecture</text>
  <text x="725" y="109" text-anchor="middle" class="subtitle">Production ML workflow for training, validation, registry, and batch inference</text>

  <g class="card" transform="translate(70 140)">
    <rect x="0" y="0" width="180" height="125" rx="20" fill="url(#slate)" stroke="#64748b" stroke-width="2"/>
    <circle cx="48" cy="42" r="22" fill="#ffffff" opacity="0.96"/>
    <path d="M39 42h18M48 33v18M35 36l26 12M61 36L35 48" stroke="#475569" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <text x="96" y="42" class="cardTitle">Raw Data</text>
    <text x="96" y="66" class="cardText">CSV / source</text>
    <text x="96" y="84" class="cardText">files &amp; tables</text>
    <rect x="22" y="98" width="136" height="10" rx="5" fill="#ffffff" fill-opacity="0.7"/>
  </g>

  <g class="card" transform="translate(285 140)">
    <rect x="0" y="0" width="218" height="125" rx="20" fill="url(#blue)" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="50" cy="42" r="22" fill="#ffffff" opacity="0.96"/>
    <path d="M38 46 L50 30 L62 46" stroke="#2563eb" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M42 52h16v14H42z" stroke="#2563eb" stroke-width="2.8" fill="none"/>
    <text x="92" y="42" class="cardTitle">01 Ingestion</text>
    <text x="92" y="66" class="cardText">Load data</text>
    <text x="92" y="84" class="cardText">Validate schema</text>
    <text x="24" y="110" class="tiny">Spark ETL</text>
  </g>

  <g class="card" transform="translate(538 140)">
    <rect x="0" y="0" width="218" height="125" rx="20" fill="url(#green)" stroke="#22c55e" stroke-width="2"/>
    <circle cx="50" cy="42" r="22" fill="#ffffff" opacity="0.96"/>
    <path d="M36 53h28M38 42h24M42 31h16" stroke="#16a34a" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M50 31v33" stroke="#16a34a" stroke-width="2.2" stroke-linecap="round"/>
    <text x="92" y="42" class="cardTitle">02 Feature</text>
    <text x="92" y="66" class="cardText">Engineer features</text>
    <text x="92" y="84" class="cardText">Transform inputs</text>
    <text x="24" y="110" class="tiny">Preparation</text>
  </g>

  <g class="card" transform="translate(790 140)">
    <rect x="0" y="0" width="208" height="125" rx="20" fill="url(#purple)" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="48" cy="42" r="22" fill="#ffffff" opacity="0.96"/>
    <path d="M35 52 L48 28 L61 52" stroke="#7c3aed" stroke-width="2.8" fill="none" stroke-linecap="round"/>
    <path d="M40 52h16v14H40z" stroke="#7c3aed" stroke-width="2.8" fill="none"/>
    <text x="88" y="42" class="cardTitle">03 Train</text>
    <text x="88" y="66" class="cardText">Model learning</text>
    <text x="88" y="84" class="cardText">Track metrics</text>
    <text x="24" y="110" class="tiny">MLflow</text>
  </g>

  <g class="card" transform="translate(1035 140)">
    <rect x="0" y="0" width="250" height="125" rx="20" fill="url(#orange)" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="50" cy="42" r="22" fill="#ffffff" opacity="0.96"/>
    <path d="M40 30h20v12H40zm-8 18h36M40 68h20M34 38l16-12 16 12" stroke="#d97706" stroke-width="2.1" fill="none" stroke-linecap="round"/>
    <text x="96" y="42" class="cardTitle">MLflow</text>
    <text x="96" y="66" class="cardText">Experiment tracking</text>
    <text x="96" y="84" class="cardText">Model lineage</text>
    <text x="24" y="110" class="tiny">Runs + metrics</text>
  </g>

  <path d="M250 202 H285" class="pipe"/>
  <path d="M503 202 H538" class="pipe"/>
  <path d="M756 202 H790" class="pipe"/>
  <path d="M998 202 H1035" class="pipe"/>

  <g class="card" transform="translate(300 345)">
    <rect x="0" y="0" width="272" height="154" rx="20" fill="url(#blue)" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="44" cy="38" r="20" fill="#ffffff" opacity="0.96"/>
    <path d="M35 32h18M32 44h24M35 56h18" stroke="#2563eb" stroke-width="2.8" stroke-linecap="round"/>
    <text x="90" y="40" class="cardTitle">04 Validation</text>
    <text x="90" y="66" class="cardText">Threshold checks</text>
    <text x="90" y="86" class="cardText">Recall / accuracy</text>
    <text x="90" y="106" class="cardText">Drift monitoring</text>
    <rect x="22" y="120" width="90" height="20" rx="10" class="chip"/>
    <text x="67" y="134" text-anchor="middle" class="badge">Quality gate</text>
  </g>

  <g class="card" transform="translate(610 345)">
    <rect x="0" y="0" width="300" height="154" rx="20" fill="url(#green)" stroke="#22c55e" stroke-width="2"/>
    <circle cx="44" cy="38" r="20" fill="#ffffff" opacity="0.96"/>
    <path d="M34 38l10-10 10 10-10 10zM31 54h26M39 20v12" stroke="#16a34a" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="92" y="40" class="cardTitle">05 Registration</text>
    <text x="92" y="66" class="cardText">Model registry</text>
    <text x="92" y="86" class="cardText">Versioned artifacts</text>
    <text x="92" y="106" class="cardText">Approval workflow</text>
    <rect x="22" y="120" width="110" height="20" rx="10" class="chip"/>
    <text x="77" y="134" text-anchor="middle" class="badge">Production</text>
  </g>

  <g class="card" transform="translate(960 345)">
    <rect x="0" y="0" width="300" height="154" rx="20" fill="url(#purple)" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="44" cy="38" r="20" fill="#ffffff" opacity="0.96"/>
    <path d="M34 48c2-12 11-18 22-18s20 6 22 18" stroke="#7c3aed" stroke-width="2.7" fill="none" stroke-linecap="round"/>
    <path d="M38 48h32M40 58h28" stroke="#7c3aed" stroke-width="2.7" stroke-linecap="round"/>
    <text x="92" y="40" class="cardTitle">06 Batch Inference</text>
    <text x="92" y="66" class="cardText">Score records</text>
    <text x="92" y="86" class="cardText">Generate predictions</text>
    <text x="92" y="106" class="cardText">Operational outputs</text>
    <rect x="22" y="120" width="112" height="20" rx="10" class="chip"/>
    <text x="78" y="134" text-anchor="middle" class="badge">Output jobs</text>
  </g>

  <path d="M572 420 H610" class="pipe"/>
  <path d="M910 420 H960" class="pipe"/>

  <g>
    <rect x="145" y="565" width="1160" height="110" rx="18" fill="#f8fafc" stroke="#d1d9e6" stroke-width="2"/>
    <text x="170" y="595" class="section">PLATFORM LAYER</text>

    <rect x="330" y="606" width="200" height="42" rx="12" fill="#edf2ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="430" y="633" text-anchor="middle" class="cardText">Databricks Workspace</text>

    <rect x="560" y="606" width="200" height="42" rx="12" fill="#ecfdf5" stroke="#86efac" stroke-width="1.5"/>
    <text x="660" y="633" text-anchor="middle" class="cardText">PySpark + Notebooks</text>

    <rect x="790" y="606" width="200" height="42" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
    <text x="890" y="633" text-anchor="middle" class="cardText">Model Registry</text>

    <rect x="1020" y="606" width="200" height="42" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="1120" y="633" text-anchor="middle" class="cardText">CI/CD + Automation</text>

    <path d="M530 627 H560" class="line"/>
    <path d="M760 627 H790" class="line"/>
    <path d="M990 627 H1020" class="line"/>
  </g>

  <path d="M1170 250 L1170 318 L1048 318" class="line"/>
  <path d="M870 250 L870 318 L760 318" class="line"/>
  <path d="M945 250 L945 318 L700 318" class="line"/>
  <path d="M695 250 L695 318 L515 318" class="line"/>

  <g transform="translate(1220 160)">
    <rect x="0" y="0" width="130" height="90" rx="15" fill="#ffffff" stroke="#dbe7f6" stroke-width="2"/>
    <rect x="16" y="18" width="98" height="16" rx="8" fill="#dbeafe"/>
    <circle cx="28" cy="58" r="10" fill="#0ea5e9"/>
    <path d="M24 58h8M28 54v8" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="48" y="62" class="tiny">Data flow</text>
  </g>
</svg>
