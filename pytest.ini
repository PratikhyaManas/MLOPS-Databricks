[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*

# Coverage options
addopts = 
    -v
    --cov=src
    --cov-report=term-missing:skip-covered
    --cov-report=html
    --cov-report=xml
    --cov-fail-under=70
    --strict-markers

# Markers for test categorization
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests
