# Model configuration

models:
  random_forest:
    n_estimators: 100
    max_depth: 10
    min_samples_split: 5
    random_state: 42
  
  gradient_boosting:
    n_estimators: 100
    learning_rate: 0.1
    max_depth: 5
    random_state: 42
  
  xgboost:
    n_estimators: 100
    max_depth: 6
    learning_rate: 0.1
    objective: 'binary:logistic'

training:
  test_size: 0.2
  validation_size: 0.1
  random_state: 42
  stratify: true

mlflow:
  experiment_path: /Shared/mlops-experiments
  artifact_location: dbfs:/mlflow/artifacts
  autolog: true
