name: MLOps Databricks Deployment

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/**'
      - 'config/**'
      - 'deployment/**'
      - 'requirements.txt'
      - 'setup.py'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches:
      - main
      - develop

env:
  PYTHON_VERSION: '3.10'

jobs:
  # Job 1: Test and Code Quality
  test-and-lint:
    name: Test & Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with Flake8
        run: |
          flake8 src/ tests/ --max-line-length=100 --ignore=E203,W503
        continue-on-error: true

      - name: Check Code Formatting with Black
        run: |
          black src/ tests/ --check
        continue-on-error: true

      - name: Type Check with MyPy
        run: |
          mypy src/ --ignore-missing-imports
        continue-on-error: true

      - name: Run Unit Tests
        run: |
          pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload Coverage Reports
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # Job 2: Build Wheel
  build:
    name: Build Python Wheel
    runs-on: ubuntu-latest
    needs: test-and-lint
    if: success()
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Build Wheel Package
        run: |
          python setup.py bdist_wheel

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: wheel-artifact
          path: dist/
          retention-days: 30

  # Job 3: Deploy to Development
  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment:
      name: development
      url: https://databricks.com
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Databricks CLI
        run: |
          python -m pip install --upgrade pip
          pip install databricks-cli databricks-sdk

      - name: Deploy to Dev Environment
        run: |
          bash deployment/deploy.sh dev
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_DEV }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_DEV }}

  # Job 4: Deploy to Staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    environment:
      name: staging
      url: https://databricks.com
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Databricks CLI
        run: |
          python -m pip install --upgrade pip
          pip install databricks-cli databricks-sdk

      - name: Deploy to Staging Environment
        run: |
          bash deployment/deploy.sh staging
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_STAGING }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_STAGING }}

  # Job 5: Deploy to Production
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://databricks.com
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Databricks CLI
        run: |
          python -m pip install --upgrade pip
          pip install databricks-cli databricks-sdk

      - name: Deploy to Production Environment
        run: |
          bash deployment/deploy.sh prod
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_PROD }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_PROD }}

  # Job 6: Notify on Deployment
  notify:
    name: Notification
    runs-on: ubuntu-latest
    needs: [deploy-dev, deploy-staging, deploy-prod]
    if: always()
    
    steps:
      - name: Deployment Summary
        run: |
          echo "Pipeline Summary"
          echo "================"
          echo "Dev Deployment: ${{ needs.deploy-dev.result }}"
          echo "Staging Deployment: ${{ needs.deploy-staging.result }}"
          echo "Prod Deployment: ${{ needs.deploy-prod.result }}"
