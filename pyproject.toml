[project]
name = "databricks-mlops"
version = "1.0.0"
description = "Databricks MLOps production pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "databricks-sdk>=0.18.0",
    "pyspark>=3.5.0,<4.0.0",
    "delta-spark>=3.0.0,<4.0.0",
    "mlflow>=2.10.0",
    "scikit-learn>=1.3.2",
    "xgboost>=2.0.3",
    "lightgbm>=4.1.0",
    "pandas>=2.1.4",
    "numpy>=1.26.2",
    "pyarrow>=14.0.1",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "click>=8.1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.12.0",
    "flake8>=7.0.0",
    "black>=23.12.1",
    "mypy>=1.8.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--cov=src",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=70",
    "--strict-markers",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
]
