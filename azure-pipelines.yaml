trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - src/**
      - config/**
      - deployment/**
      - requirements.txt
      - setup.py
      - azure-pipelines.yaml

pr:
  branches:
    include:
      - main
      - develop

variables:
  pythonVersion: '3.10'
  buildId: $(Build.BuildId)
  commitSha: $(Build.SourceVersion)
  vmImage: 'ubuntu-latest'
  enableSemgrep: 'false'

# Deployment stage template parameters
stages_config:
  deployments:
    dev:
      condition: "eq(variables['Build.SourceBranch'], 'refs/heads/develop')"
      environment: 'development'
    staging:
      condition: "succeeded()"
      environment: 'staging'
    prod:
      condition: "eq(variables['Build.SourceBranch'], 'refs/heads/main')"
      environment: 'production'

stages:
  # Stage 1: Test and Code Quality
  - stage: Test
    displayName: 'Test and Code Quality'
    jobs:
      - job: TestAndLint
        displayName: 'Run Tests and Linting'
        pool:
          vmImage: 'ubuntu-latest'
        
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '$(pythonVersion)'
            displayName: 'Use Python $(pythonVersion)'

          - task: Cache@2
            inputs:
              key: 'pip | "$(Agent.OS)" | requirements.txt'
              path: $(pip.cacheDir)
            displayName: 'Cache pip packages'

          - script: |
              python -m pip install --upgrade pip setuptools wheel
              pip install -r requirements.txt pytest pytest-cov pytest-mock flake8 black mypy
            displayName: 'Install Dependencies and Tools'

          - script: |
              flake8 src/ tests/ --max-line-length=100 --ignore=E203,W503 --count --statistics
            displayName: 'Lint with Flake8'
            continueOnError: true

          - script: |
              black src/ tests/ --check --diff
            displayName: 'Check Code Formatting with Black'
            continueOnError: true

          - script: |
              mypy src/ --ignore-missing-imports --show-error-codes
            displayName: 'Type Check with MyPy'
            continueOnError: true

          - script: |
              pytest tests/ -v --cov=src --cov-report=xml --cov-report=html --cov-report=term-missing
            displayName: 'Run Unit Tests with Coverage'

          - task: PublishCodeCoverageResults@1
            inputs:
              codeCoverageTool: Cobertura
              summaryFileLocation: '$(System.DefaultWorkingDirectory)/**/coverage.xml'
              reportDirectory: '$(System.DefaultWorkingDirectory)/**/htmlcov'
            displayName: 'Publish Code Coverage'

  # Stage 2: Build Artifact
  - stage: SAST
    displayName: 'Static Application Security Testing'
    dependsOn: Test
    condition: succeeded()
    jobs:
      - job: SASTScan
        displayName: 'Run Bandit and Optional Semgrep'
        pool:
          vmImage: 'ubuntu-latest'

        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '$(pythonVersion)'
            displayName: 'Use Python $(pythonVersion)'

          - script: |
              python -m pip install --upgrade pip
              pip install bandit
            displayName: 'Install Bandit'

          - script: |
              bandit -r src/ -ll -ii -f json -o bandit-report.json --exit-zero
              python - << 'PY'
              import json
              import sys

              with open("bandit-report.json", "r", encoding="utf-8") as f:
                  report = json.load(f)

              findings = report.get("results", [])
              print(f"Bandit findings (MEDIUM+): {len(findings)}")

              if findings:
                  sys.exit(1)
              PY
            displayName: 'Run Bandit (Fail on Medium+ Findings)'

          - script: |
              python -m pip install --upgrade pip
              pip install semgrep
              semgrep --config auto src/ --json --output semgrep-report.json --error
            displayName: 'Run Semgrep (Optional)'
            condition: and(succeeded(), eq(variables['enableSemgrep'], 'true'))

          - task: PublishPipelineArtifact@1
            displayName: 'Publish SAST Reports'
            condition: always()
            inputs:
              targetPath: '$(System.DefaultWorkingDirectory)'
              artifact: 'sast-reports'
              publishLocation: 'pipeline'

  - stage: Build
    displayName: 'Build Python Wheel'
    dependsOn: SAST
    condition: succeeded()
    jobs:
      - job: BuildWheel
        displayName: 'Build Python Wheel'
        pool:
          vmImage: 'ubuntu-latest'
        
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '$(pythonVersion)'
            displayName: 'Use Python $(pythonVersion)'

          - task: Cache@2
            inputs:
              key: 'pip | "$(Agent.OS)" | requirements.txt'
              path: $(pip.cacheDir)
            displayName: 'Cache pip packages'

          - script: |
              python -m pip install --upgrade pip setuptools wheel build
            displayName: 'Install Build Tools'

          - script: |
              python -m build --wheel
            displayName: 'Build Wheel Package'

          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: '$(Build.SourcesDirectory)/dist'
              ArtifactName: 'wheel-artifact'
              publishLocation: 'Container'
            displayName: 'Publish Wheel Artifact'

  # Stage 3: Deploy to Development
  - stage: DeployDev
    displayName: 'Deploy to Development'
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'))
    jobs:
      - deployment: DeployToDev
        displayName: 'Deploy to Databricks Dev'
        pool:
          vmImage: '$(vmImage)'
        environment: 'development'
        strategy:
          runOnce:
            deploy:
              steps:
                - template: deployment/deploy-template.yml
                  parameters:
                    targetEnv: 'dev'
                    databricksHost: $(DATABRICKS_HOST_DEV)
                    databricksToken: $(DATABRICKS_TOKEN_DEV)

  # Stage 4: Deploy to Staging
  - stage: DeployStaging
    displayName: 'Deploy to Staging'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: DeployToStaging
        displayName: 'Deploy to Databricks Staging'
        pool:
          vmImage: '$(vmImage)'
        environment: 'staging'
        strategy:
          runOnce:
            deploy:
              steps:
                - template: deployment/deploy-template.yml
                  parameters:
                    targetEnv: 'staging'
                    databricksHost: $(DATABRICKS_HOST_STAGING)
                    databricksToken: $(DATABRICKS_TOKEN_STAGING)

  # Stage 5: Deploy to Production
  - stage: DeployProd
    displayName: 'Deploy to Production'
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployToProd
        displayName: 'Deploy to Databricks Production'
        pool:
          vmImage: '$(vmImage)'
        environment: 'production'
        strategy:
          runOnce:
            deploy:
              steps:
                - template: deployment/deploy-template.yml
                  parameters:
                    targetEnv: 'prod'
                    databricksHost: $(DATABRICKS_HOST_PROD)
                    databricksToken: $(DATABRICKS_TOKEN_PROD)
